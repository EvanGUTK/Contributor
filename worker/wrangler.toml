# Cloudflare Worker for GitHub App read-only login.
# Secrets are NOT stored here. They are set out-of-band with `wrangler secret put`:
#   GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, WORKER_SECRET
name = "contributor-auth"
# Wrangler resolves `main` relative to this config file (worker/), i.e. worker/auth.js.
main = "auth.js"
compatibility_date = "2026-10-14"

# Routes removed: pages.dev is Cloudflare-managed and cannot be proxied via Worker routes.
# The Worker runs on contributor-auth.workers.dev — update the GitHub App callback URL
# and the static site's auth links to point there instead.

# Public, non-secret setting: where the Worker redirects users after login/logout.
[vars]
APP_ORIGIN = "https://contributor-7cw.pages.dev"

# Encrypted BYOK AI provider keys (AES-GCM, per-user key derived from WORKER_SECRET), keyed by GitHub user ID.
# Create with: wrangler kv namespace create BYOK_KEYS — replace id with the returned id
[[kv_namespaces]]
binding = "BYOK_KEYS"
id = "PLACEHOLDER_KV_ID"
