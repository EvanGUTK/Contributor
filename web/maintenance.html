<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contributor — Under Maintenance</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #08090a;
      color: #f7f8f8;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }
    .logo { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; margin-bottom: 48px; color: #f7f8f8; }
    .logo span { color: #5e6ad2; }
    .icon { font-size: 48px; margin-bottom: 24px; }
    h1 { font-size: 36px; font-weight: 600; letter-spacing: -0.8px; margin-bottom: 16px; color: #f7f8f8; }
    p { font-size: 16px; color: #8a8f98; line-height: 1.6; max-width: 420px; margin: 0 auto; }
    .badge {
      margin-top: 40px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 13px;
      color: #d0d6e0;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; display: inline-block; }
    a { color: #7170ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .footer { margin-top: 48px; font-size: 12px; color: #62666d; }
  </style>
</head>
<body>
  <div class="logo">contributor<span>.</span></div>
  <div class="icon">🔧</div>
  <h1>Under Maintenance</h1>
  <p>We're making improvements to give you a better experience. Check back soon.</p>
  <div class="badge">
    <span class="dot"></span>
    Back shortly
  </div>
  <p class="footer" style="margin-top:32px">
    Follow progress on <a href="https://github.com/EvanGUTK/Contributor" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
  </p>
</body>
</html>
